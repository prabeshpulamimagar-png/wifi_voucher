name: wifi_voucher
description: WIFI Voucher Management App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  printing: ^5.13.4
  pdf: ^3.11.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/images.png"
  android: true
  ios: true
  image_path_android: "assets/images.png"
  image_path_ios: "assets/images.png"